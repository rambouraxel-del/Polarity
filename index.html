<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#070b1f" />
    <meta name="description" content="Polarité — inversez la direction de votre vaisseau en orbite pour éviter les dangers et collecter les balises." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>Polarité</title>
  </head>
  <body>
    <div id="app">
      <div id="game" aria-label="Aire de jeu"></div>
      <div id="arena-box" aria-hidden="true"></div>
      <div id="hud" class="hidden">
        <div class="hud-left">
          <div class="hud-score" id="hud-score">0</div>
          <div class="hud-mult"><span id="hud-mult">×1</span><span class="combo-bar"><i id="hud-combo"></i></span></div>
        </div>
        <div class="hud-center">
          <div class="hud-time" id="hud-time">0:00</div>
          <div class="hud-sub" id="hud-sub"></div>
        </div>
        <div class="hud-right">
          <button id="btn-pause" class="icon-btn" tabindex="-1" aria-label="Pause" title="Pause (Échap)">
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
          </button>
        </div>
      </div>
      <div id="banner" class="hidden" role="status" aria-live="polite"></div>
      <div id="countdown" class="hidden" aria-live="assertive"></div>
      <div id="screen" class="hidden"></div>
      <noscript>Polarité nécessite JavaScript.</noscript>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
